name: app_api_sunat
description: "Facturación electrónica SUNAT (Perú) — emisión de facturas y boletas, consulta RUC/DNI y exportación de RIDE en PDF."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Modelos inmutables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Base de datos local
  drift: ^2.28.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.1

  # Red
  dio: ^5.7.0

  # Navegación
  go_router: ^14.6.2

  # PDF / RIDE
  pdf: ^3.11.1
  printing: ^5.13.4
  barcode: ^2.2.9

  # Compartir archivos
  share_plus: ^10.1.3

  # Formato de moneda y fechas (es_PE)
  intl: ^0.20.2

  # Formularios
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2

  # UI
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  crypto: ^3.0.7
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.0
  freezed: ^3.2.0
  json_serializable: ^6.9.5
  drift_dev: ^2.28.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Las tipografías van empaquetadas en lugar de descargarse con `google_fonts`:
  # la app tiene que verse igual sin conexión y el PDF necesita el archivo TTF
  # para poder incrustarlo en el RIDE.
  fonts:
    # Geométrica, para títulos y cifras destacadas.
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    # Humanista, para texto corrido y formularios.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
